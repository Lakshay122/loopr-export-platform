server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS. Look up the API on each use, because its address can change when it restarts.
  resolver 127.0.0.11 valid=5s;
  set $api_upstream http://api:3000;

  # Same origin for the browser: the UI and the API are both served from here.
  location /api/ { proxy_pass $api_upstream; }
  location /internal/ { proxy_pass $api_upstream; }

  # Single-page app: unknown paths load index.html and React picks the screen.
  location / { try_files $uri /index.html; }
}
